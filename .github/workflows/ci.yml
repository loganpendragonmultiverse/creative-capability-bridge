name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src tests
      - run: pytest
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: python -m build
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y blender inkscape fonts-dejavu-core
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install -e ".[dev]"
      - run: CCB_REQUIRE_NATIVE=1 pytest tests/test_native.py --no-cov
      - run: python -c "import json; from creative_capability_bridge.conformance_matrix import run_matrix; open('verified-version-matrix.json','w').write(json.dumps(run_matrix(native=True),indent=2))"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-version-matrix
          path: verified-version-matrix.json
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip_audit


  gimp-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build isolated real GIMP 3 environment
        run: docker build --tag ccb-gimp-native -f tools/native-gimp.Dockerfile tools
      - name: Require saved-XCF semantic acceptance
        run: |
          docker image inspect ccb-gimp-native --format '{{.Id}}' > verified-gimp-image.txt
          docker run --rm --cpus=2 --memory=4g --pids-limit=256 --cap-drop=ALL --security-opt=no-new-privileges \
            --user "$(id -u):$(id -g)" --env HOME=/tmp --env LC_ALL=C.UTF-8 --env CCB_REQUIRE_GIMP=1 \
            --mount "type=bind,src=$PWD,dst=/work" --workdir /work ccb-gimp-native sh -lc \
            'set -e; python3 -m venv /tmp/ccb-venv; /tmp/ccb-venv/bin/python -m pip install -e ".[dev]"; /tmp/ccb-venv/bin/python tools/verify_gimp_native.py'
      - uses: actions/upload-artifact@v7
        with:
          name: verified-gimp-native
          path: |
            verified-gimp-native.json
            verified-gimp-image.txt
