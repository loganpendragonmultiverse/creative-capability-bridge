name: Bug report
description: Report a reproducible protocol, adapter, CLI, or plan-builder defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Describe the incorrect behavior and affected capability. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include a minimal synthetic plan, command, expected semantic result, and actual result. }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, description: CCB, Python, OS, adapter, and native application versions }
    validations: { required: true }
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety
      options:
        - label: I removed private documents, credentials, and personal information.
          required: true

