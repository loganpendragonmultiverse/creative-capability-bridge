[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-capability-bridge"
version = "1.3.0"
description = "Plan, inspect, coordinate, execute, and verify portable creative-app operations."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = ["cryptography>=48.0.1,<50"]

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
creative-capability-bridge = "creative_capability_bridge.cli:main"
ccb = "creative_capability_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=creative_capability_bridge --cov-branch --cov-report=term-missing --cov-fail-under=90"
